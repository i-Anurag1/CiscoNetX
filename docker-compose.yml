services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cisconetx
      POSTGRES_PASSWORD: cisconetx
      POSTGRES_DB: cisconetx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cisconetx -d cisconetx"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cisconetx:cisconetx@postgres:5432/cisconetx
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:-replace-this-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 15
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
volumes:
  pgdata: {}
